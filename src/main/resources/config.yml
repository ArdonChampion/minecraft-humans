# Humans - AI humans for Paper 26.3
gemini:
  # File containing the Gemini API key (never put the key itself in this config)
  api_key_file: plugins/Humans/gemini.key
  decision_model: gemini-decision-1
  chat_model: gemini-3.5-flash-lite

# Text AI for speech and planning: any OpenAI-compatible endpoint. Falls back to Gemini Flash-Lite if it fails.
text:
  base_url: https://100milionseek.top/v1
  model: deepseek-v4.1-flash-free
  # File containing the API key (never put the key itself in this config)
  api_key_file: plugins/Humans/text.key
  per_minute: 60
  speech_max_tokens: 900
  plan_max_tokens: 4000
  plan_timeout_seconds: 70

planner:
  # Max planning rounds per goal before a human gives up
  max_rounds: 20

family:
  food_needed: 6
  food_used: 6
  cooldown_minutes: 20
  grow_up_minutes: 20
  max_humans: 16

# Debug event log (plugins/Humans/logs/humans-YYYY-MM-DD.jsonl): decisions, chat, plans, tasks, AI calls, errors
logs:
  enabled: true
  keep_days: 14

zones:
  # Humans won't break/build/pick up within this many blocks of players' chests, beds, furnaces, signs...
  auto_radius: 9

chat:
  # Who answers chat: deepseek = one AI "mind" call that sees the conversation + surroundings and both talks and acts
  # (falls back to the older Gemini intent pipeline when DeepSeek is busy). gemini = always the older pipeline.
  engine: deepseek
  # Wait this long (ticks) after a message so quick bursts are answered together
  gather_ticks: 30
  mind_max_tokens: 3500
  # after this many seconds without a DeepSeek answer the same question goes to Gemini instead
  mind_timeout_seconds: 15
  mind_fallback_tokens: 1500
  # unprompted lines (not answers) at most this often per human; near-repeats are always skipped
  spontaneous_cooldown_seconds: 45

budget:
  # Gemini Decision 1 free tier: 200 RPM, 50k TPM, 10k RPD. We stay well under.
  decisions_per_day: 9000
  decisions_per_minute: 120
  decision_tokens_per_minute: 40000
  # Minimum seconds between two batched decision calls
  min_seconds_between_calls: 2.0
  # Flash-Lite (chat lines). Free limits aren't published; keep this conservative.
  chat_per_day: 400
  chat_per_minute: 8

brain:
  # Who picks everyday actions: deepseek (the text AI, free) or gemini (Gemini Decision).
  # If DeepSeek errors or is busy, the call falls back to Gemini Decision, then to the offline brain.
  engine: deepseek
  deepseek_max_humans_per_call: 8
  deepseek_min_seconds_between_calls: 2.5
  deepseek_max_tokens: 3500
  deepseek_timeout_seconds: 25
  # Max humans decided in one batched call
  max_humans_per_call: 20
  # Re-think a long-running task after this many seconds
  rethink_seconds: 30
  # Humans only act when a player is within this many blocks
  awake_radius: 96
  # Gemini decides only for humans within this many blocks of a player;
  # further away (nobody watching) they use the free offline brain
  ai_radius: 48
  # testing only: act even with no players online
  always_awake: false
  # Seconds a human waits between spontaneous lines
  talk_cooldown_seconds: 40

pack:
  # The plugin hosts its own face-expression resource pack on this port
  port: 8080
  public_url: http://YOUR.SERVER.IP:8080/humans-pack.zip   # must be reachable by players
  required: true
  prompt: "The AI humans need this tiny pack for their faces & expressions."

# Sound played when a human changes expression (any sound key works)
expressions:
  happy:     { sound: entity.vindicator.celebrate, volume: 0.7, pitch: 1.35 }
  sad:       { sound: entity.wandering_trader.no,  volume: 0.8, pitch: 0.75 }
  angry:     { sound: entity.vindicator.ambient,   volume: 0.9, pitch: 1.0 }
  scared:    { sound: entity.pillager.hurt,        volume: 0.8, pitch: 1.5 }
  surprised: { sound: entity.evoker.ambient,       volume: 0.8, pitch: 1.6 }
  hurt:      { sound: entity.player.hurt,          volume: 1.0, pitch: 1.0 }
  sleeping:  { sound: '',                          volume: 0,   pitch: 1 }
  neutral:   { sound: '',                          volume: 0,   pitch: 1 }
  blink:     { sound: '',                          volume: 0,   pitch: 1 }
